[package]
name = "script-bench"
version = "0.1.0"
edition = "2021"
authors = ["Aleksandr Orlenko <zxteam@pm.me>"]

[lib]
name = "script_bench"

[features]
boa = ["dep:boa_engine", "dep:boa_gc", "dep:boa_runtime"]
koto = ["dep:koto"]
martite = ["dep:martite"]
mlua_lua55 = ["mlua/lua55", "mlua/vendored"]
mlua_luau = ["mlua/luau-jit"]
rhai = ["dep:rhai", "dep:itertools"]
roto = ["dep:roto"]
wasmi = ["dep:wasmi"]
wasmtime = ["dep:wasmtime"]
instructions = ["dep:gungraun"]

[dependencies]
anyhow = "1.0.104"
gungraun = { version = "0.20.0", optional = true }
itertools = { version = "0.15.0", optional = true }
boa_engine = { version = "0.22.0", optional = true }
boa_gc = { version = "0.22.0", optional = true }
boa_runtime = { version = "0.22.0", optional = true }
koto = { version = "0.16.1", optional = true }
martite = { path = "../martite/crates/martite", optional = true }
mlua = { version = "0.12.2", optional = true }
rhai = { version = "1.26.1", optional = true }
roto = { version = "0.12.0", optional = true, default-features = false }
rquickjs = { version = "0.14.0", optional = true }
wasmi = { version = "2.0.0", optional = true }
wasmtime = { version = "49.0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2" }

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "boa"
harness = false
required-features = ["boa"]

[[bench]]
name = "koto"
harness = false
required-features = ["koto"]

[[bench]]
name = "martite"
harness = false
required-features = ["martite"]

[[bench]]
name = "mlua_lua55"
harness = false
required-features = ["mlua_lua55"]

[[bench]]
name = "mlua_luau"
harness = false
required-features = ["mlua_luau"]

[[bench]]
name = "rhai"
harness = false
required-features = ["rhai"]

[[bench]]
name = "roto"
harness = false
required-features = ["roto"]

[[bench]]
name = "rquickjs"
harness = false
required-features = ["rquickjs"]

[[bench]]
name = "wasmi"
harness = false
required-features = ["wasmi"]

[[bench]]
name = "wasmtime"
harness = false
required-features = ["wasmtime"]

[[bench]]
name = "native"
harness = false

[[bench]]
name = "instructions_boa"
path = "benches/instructions/boa.rs"
harness = false
required-features = ["instructions", "boa"]

[[bench]]
name = "instructions_koto"
path = "benches/instructions/koto.rs"
harness = false
required-features = ["instructions", "koto"]

[[bench]]
name = "instructions_martite"
path = "benches/instructions/martite.rs"
harness = false
required-features = ["instructions", "martite"]

[[bench]]
name = "instructions_mlua_lua55"
path = "benches/instructions/mlua_lua55.rs"
harness = false
required-features = ["instructions", "mlua_lua55"]

[[bench]]
name = "instructions_mlua_luau"
path = "benches/instructions/mlua_luau.rs"
harness = false
required-features = ["instructions", "mlua_luau"]

[[bench]]
name = "instructions_rhai"
path = "benches/instructions/rhai.rs"
harness = false
required-features = ["instructions", "rhai"]

[[bench]]
name = "instructions_roto"
path = "benches/instructions/roto.rs"
harness = false
required-features = ["instructions", "roto"]

[[bench]]
name = "instructions_rquickjs"
path = "benches/instructions/rquickjs.rs"
harness = false
required-features = ["instructions", "rquickjs"]

[[bench]]
name = "instructions_wasmi"
path = "benches/instructions/wasmi.rs"
harness = false
required-features = ["instructions", "wasmi"]

[[bench]]
name = "instructions_wasmtime"
path = "benches/instructions/wasmtime.rs"
harness = false
required-features = ["instructions", "wasmtime"]
