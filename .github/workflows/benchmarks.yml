name: benchmarks

on:
  workflow_dispatch:
    inputs:
      martite-ref:
        description: Martite commit, branch, or tag
        required: false
        default: dev
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout benchmark fork
        uses: actions/checkout@v4
        with:
          path: bench

      - name: Checkout Martite
        uses: actions/checkout@v4
        with:
          repository: Brunzsn/Martite
          path: martite
          ref: ${{ github.event.inputs['martite-ref'] || 'dev' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench

      - name: Cache cargo-criterion
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-criterion
          key: cargo-criterion-${{ runner.os }}-v1

      - name: Install cargo-criterion
        run: command -v cargo-criterion >/dev/null || cargo install cargo-criterion --locked

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run full benchmark suite
        working-directory: bench
        run: uv run bench.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: script-bench-results
          path: |
            bench/*.png
            bench/target/benchmark-results.json
