name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine:
          - boa
          - koto
          - martite
          - mlua_lua55
          - mlua_luau
          - rhai
          - roto
          - rquickjs
          - wasmi
          - wasmtime
    steps:
      - name: Checkout benchmark fork
        uses: actions/checkout@v4
        with:
          path: bench

      - name: Checkout Martite
        uses: actions/checkout@v4
        with:
          repository: Brunzsn/Martite
          path: martite
          ref: dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
          key: ${{ matrix.engine }}

      - name: Build wasm scripts
        working-directory: bench
        run: |
          set -o pipefail
          cargo run --quiet --example list_cases -- wasm | while IFS=$'\t' read -r source module; do
            crate_name="$(basename "$source" .rs | cut -d. -f1)"
            rustc --target wasm32-unknown-unknown -Cpanic=abort -O \
              --crate-name "$crate_name" "$source" -o "$module"
          done

      - name: Run every case once
        working-directory: bench
        env:
          # The timed path is not used in criterion's test mode, so skip the
          # slow fat-LTO bench build.
          CARGO_PROFILE_BENCH_LTO: "false"
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
        run: cargo bench --bench ${{ matrix.engine }} --features ${{ matrix.engine }} -- --test

  native:
    name: native baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout benchmark fork
        uses: actions/checkout@v4
        with:
          path: bench

      - name: Checkout Martite
        uses: actions/checkout@v4
        with:
          repository: Brunzsn/Martite
          path: martite
          ref: dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
          key: native

      - name: Run native baseline once
        working-directory: bench
        env:
          CARGO_PROFILE_BENCH_LTO: "false"
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
        run: cargo bench --bench native -- --test
